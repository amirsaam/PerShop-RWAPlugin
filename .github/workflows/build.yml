name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PERSHOP_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python3 -m pip install '.[test]'
      - name: Run shop and safety regression tests
        timeout-minutes: 5
        run: |
          python3 tests/test_shop.py
          python3 -m pytest -q tests/test_safety_regressions.py tests/test_api_hardening.py
      - name: Run route build tests
        timeout-minutes: 5
        run: python3 tests/test_routes_build.py
      - name: Run Telegram client tests
        timeout-minutes: 5
        run: python3 tests/test_telegram_client.py
      - name: Check JavaScript syntax
        timeout-minutes: 2
        run: node --check rwa_plugin_pershop/static/app.js
      - name: Run PostgreSQL billing, trial and external provisioning recovery tests
        timeout-minutes: 10
        run: pytest -q tests/test_postgres_billing.py tests/test_postgres_trials.py tests/test_postgres_api_users.py tests/test_postgres_hardening.py tests/test_postgres_reconciliation.py

  wheel:
    needs: test
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync pyproject version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "tag=$TAG_VERSION pyproject=$PY_VERSION"
          if [ "$PY_VERSION" != "$TAG_VERSION" ]; then
            sed -i "s/^version = \".*\"/version = \"$TAG_VERSION\"/" pyproject.toml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): bump version to $TAG_VERSION for $GITHUB_REF_NAME"
            if git push origin HEAD:main; then
              echo "version bump pushed to main"
            else
              echo "::warning::could not push version bump to main (tag may not be main's tip); wheel will still carry the tag version"
            fi
          else
            echo "pyproject already at $TAG_VERSION"
          fi
      - run: pip install setuptools wheel cryptography fastapi
      - run: pip wheel . --no-deps -w dist
      - name: Validate wheel installation and import
        run: |
          python3 -m pip install --no-index --no-deps --target "$RUNNER_TEMP/pershop-wheel" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/pershop-wheel" python3 -c "import rwa_plugin_pershop; print(rwa_plugin_pershop.__file__)"
      - uses: actions/upload-artifact@v4
        with:
          name: pershop-wheel
          path: dist/*.whl
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.whl
